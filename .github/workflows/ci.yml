name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Use the UPSTREAM INSTALLER. The `cyrius.cyml [package].cyrius` pin stays
        # the single source of truth (CLAUDE.md § CI/Release) — no version is
        # hardcoded in this YAML; the pin is read and handed to the installer.
        #
        # ⚠ THIS REPLACES A HAND-ROLLED TARBALL EXTRACTION THAT BROKE AT 6.5.33,
        # and it was wrong in three ways, only one of which was visible:
        #
        # 1. WRONG LAYOUT (the failure). It laid the toolchain out FLAT, as
        #    ~/.cyrius/{bin,lib}. cyrius resolves the stdlib snapshot from
        #    ~/.cyrius/versions/<pin>/lib, so `cyrius deps` died with
        #    "pins version 6.5.33 but it is not installed at
        #    /home/runner/.cyrius/versions/6.5.33/lib". The installer creates the
        #    versioned tree, writes ~/.cyrius/current, and symlinks bin/ and lib/
        #    at it — which is also what `cyrius lib sync` needs.
        #
        # 2. NO INTEGRITY CHECK AT ALL. It did `curl -sLO` on a release tarball and
        #    untarred it. The installer REQUIRES the published `.sha256` and fails
        #    closed if it is missing, unverifiable, or mismatched (CVE-21), and
        #    verifies an Ed25519 signature over SHA256SUMS where one is published
        #    (CVE-13). This repo ships a SECURITY.md and a security job; it should
        #    not have been installing an unverified binary toolchain.
        #
        # 3. IT COULD NOT FAIL. Every copy ended in `2>/dev/null || true`, so an
        #    empty bin/ or a missing lib/ installed "successfully" and the error
        #    surfaced later as something else. The installer errors loudly on a
        #    tarball with no bin/ or no lib/. **A step that cannot fail is not a
        #    step** — same shape as the three non-gating gates in 2.9.2.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          [ -n "$CYRIUS_VERSION" ] || { echo "could not read the cyrius pin from cyrius.cyml"; exit 1; }
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
          echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"

      - name: Verify toolchain matches the pin
        # The install failure above surfaced two steps later, as a `cyrius deps`
        # error about a path. Assert it HERE, where it is diagnosable: the binary
        # on PATH must be the version cyrius.cyml pins, and the versioned stdlib
        # snapshot the manifest resolves against must actually exist.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          ACTUAL="$(cyrius version | head -1 | awk '{print $2}')"
          [ "$ACTUAL" = "$CYRIUS_VERSION" ] || {
            echo "::error::toolchain is $ACTUAL but cyrius.cyml pins $CYRIUS_VERSION"; exit 1; }
          [ -d "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" ] || {
            echo "::error::stdlib snapshot missing at ~/.cyrius/versions/$CYRIUS_VERSION/lib"; exit 1; }
          echo "toolchain $ACTUAL matches the pin; stdlib snapshot present"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Verify dep hashes
        # cyrius.lock is committed; mismatch fails the build.
        # Skipped on first run when no lockfile exists yet.
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::no cyrius.lock committed yet — skipping verify"
          fi

      - name: Lint
        # A file fails the step on either non-zero rc OR a `^  warn ` line in
        # stdout — defense in depth. Historically `cyrius lint` returned the
        # warning count as its exit code; as of 6.2.11 it exits 0 even with
        # warnings (issues/archived/2026-04-26-cyrius-lint-rc-as-warning-count),
        # so the stdout `^  warn ` grep is now the load-bearing condition. The
        # `set +e` here keeps the loop alive past a per-file warning so the
        # report covers every file (under GHA's default `set -eo pipefail`,
        # `out=$(failing_cmd)` would otherwise abort the whole run on the
        # first file with a warning, masking which file tripped it).
        run: |
          set +e
          fail=0
          for f in src/*.cyr examples/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr; do
            [ -f "$f" ] || continue
            echo "=== cyrlint: $f ==="
            out=$(cyrius lint "$f" 2>&1)
            rc=$?
            echo "$out"
            if [ "$rc" -ne 0 ] || echo "$out" | grep -qE '^\s*warn '; then
              echo "::error file=$f::cyrius lint failed (rc=$rc)"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Format check
        # `cyrius fmt <file> --check` signals drift via EXIT CODE; in check
        # mode it writes nothing to stdout (its report goes to stderr), so
        # never diff its stdout against the file — that always "differs" for
        # a non-empty file and fails every file (the old bug). Aggregate the
        # rc across files so every drifted file is annotated, not just the
        # first. Matches abaco's gate.
        #
        # ⚠ THE REMEDIATION STRING THIS STEP PRINTED USED TO DESTROY THE FILE.
        # It read `cyrius fmt $f > tmp && mv tmp $f`, which was correct while
        # `cyrius fmt` was stdout-only. cyrius 6.5.28 made it REWRITE IN PLACE
        # and print nothing, so the redirect captured an empty stream and the
        # `mv` moved that over the source. Reproduced on 6.5.33 with the exact
        # command above: src/vec2.cyr, 2,233 bytes -> 0 bytes, rc=0.
        #
        # ⚠ AND IT WAS AIMED AT THE WORST POSSIBLE MOMENT: this annotation only
        # ever prints for a file that is ALREADY drifting, and the 6.5.28 fmt
        # fix drifted 38 of this repo's 44 sources at once. A maintainer doing
        # what the error told them would have zeroed out most of the library.
        # The in-place form is now the whole instruction. [measured: 2026-08-21]
        run: |
          fail=0
          for f in src/*.cyr examples/*.cyr tests/*.tcyr tests/*.bcyr tests/*.fcyr; do
            [ -f "$f" ] || continue
            cyrius fmt "$f" --check >/dev/null 2>&1 || {
              echo "::error file=$f::fmt drift — run 'cyrius fmt $f' (rewrites in place since 6.5.28; do NOT redirect its stdout)"
              fail=1
            }
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Vet
        run: cyrius vet src/main.cyr

      - name: Verify hand-encoded f64 constants
        # hisab encodes f64 constants as raw i64 bit patterns (Cyrius has no
        # float literals), so the adjacent comment is the only readable
        # statement of intent. The 2026-08-03 audit found SEVEN tables where the
        # bits did not encode the commented value — including four published
        # numerical-method tableaux, each falsified by its own invariant
        # (DOPRI45 was not a consistent integrator at any order). The defect
        # class is mechanical, so this gate is too.
        run: ./scripts/check-constants.sh

      - name: Public surface is complete and exact
        # ⭐ ADDED 3.1.0 (the `pub fn` half). Every non-underscore top-level
        # declaration in src/ carries `public`, plus the 24 underscore helpers
        # that another module reaches. In the shipped tree that is a documented
        # NO-OP — no module is `private`, and the suites compile byte-identical
        # with and without it — which is exactly why a gate is needed: nothing in
        # an ordinary build can tell a complete surface from an incomplete one.
        # The script flips every module `private` in a scratch copy and proves
        # five claims (naming completeness, per-FILE internal completeness, a
        # generated consumer reaching all 890 public items, every non-public
        # item refused, examples clean). Mutation-proven on four mutants; see
        # the script header — including why its first draft was vacuous (the
        # bundle is ONE file, so `private` inside it faces only a consumer) and
        # why the probes are calls, never `&name` (an upstream visibility hole).
        run: ./scripts/check-public-surface.sh

      - name: Result migration has no vacuous call sites
        # ⛔ ADDED 3.1.0 — THIS GATE SHIPPED IN 3.0.0 AND WAS NEVER RUN BY CI.
        # `scripts/check-result-migration.sh` guards the one failure the
        # compiler cannot see: a `Result` in ARGUMENT position degrades to its
        # tag, and `Ok` tag = 0 = `HSB_ERR_NONE`, so a stale
        # `assert_eq(f(...), HSB_ERR_NONE)` passes while testing nothing.
        # 3.0.0 mutation-proved it and left it un-wired, the same shape as
        # 2.19.0's `check-measurements.sh` running only on pull requests in a
        # repo with none. A gate nobody runs is a comment.
        run: |
          ./scripts/check-result-migration.sh
          ./scripts/check-result-migration.sh --selftest

      - name: Verify dist bundle is in sync with lib/
        # `cyrius distlib` regenerates `dist/hisab.cyr` from the [lib]
        # modules list. Fails CI if the committed bundle drifts from
        # what the current lib/ would produce — run `cyrius distlib`
        # locally and commit the result before pushing.
        #
        # ⚠ HISTORY, kept because the shape recurs: cyrius 6.5.14–6.5.16 shipped a
        # `distlib` bundle self-check that compiled the bundle ALONE under
        # `_cc_allow_undef`, which suppresses undefined FUNCTIONS but cannot reach
        # undefined NAMES (they hard-exit in the frontend). Any bundle reading a
        # stdlib constant — hisab's reads `F64_ONE` — failed its own self-check, so
        # this step tolerated exactly that signature for three toolchain releases.
        # **Fixed upstream in 6.5.17**; the tolerance is removed and a non-zero
        # `distlib` is a failure again. See
        # docs/development/issues/archived/2026-08-09-cyrius-distlib-selfcheck-rejects-stdlib-globals.md
        run: |
          cyrius distlib
          if ! git diff --quiet dist/hisab.cyr dist/hisab.deps; then
            echo "ERROR: dist/ is stale. Run 'cyrius distlib' and commit."
            git --no-pager diff dist/hisab.cyr dist/hisab.deps | head -40
            exit 1
          fi
          echo "dist/hisab.cyr + dist/hisab.deps match lib/"

      - name: Bundle compiles as a consumer builds it
        # The half of the distlib self-check that is worth having, done right:
        # the bundle is compiled WITH the manifest's stdlib resolved, which is
        # exactly how a consumer includes it. Strictly stronger than compiling
        # it alone and pretending every undefined symbol is expected.
        run: cyrius check --with-deps dist/hisab.cyr

      - name: "Discarded #must_use results"
        # ⛔ THE LINT GATE ABOVE CANNOT SEE THIS AND THAT IS MEASURED, NOT ASSUMED.
        # `#must_use` is a COMPILER diagnostic, not a cyrlint one: a file whose
        # result is discarded gives `cyrius lint` "0 warnings" and matches the
        # `^  warn ` grep zero times, while `cyrius build` prints
        # `warning: #must_use result of 'f' is discarded`. Annotating the fallible
        # surface without this step would have been decorative.
        #
        # SCOPE, and why it stops where it does. The bundle is compiled with the
        # stdlib resolved, so this reaches every intra-library call site across all
        # 35 modules — verified by installing a deliberate discard in src/ode.cyr
        # and watching this step go 0 -> 1. `examples/` is included because an
        # example is copied more often than it is read. `tests/` is NOT: calling a
        # fallible function and asserting on its out-parameter is a legitimate
        # testing idiom, and 67 sites there do exactly that.
        #
        # ⛔ THIS STEP WAS RED FROM THE COMMIT THAT ADDED IT (2.19.0 bite two) UNTIL
        # 2.19.0 SHIPPED, AND IT FAILED WITH NO OUTPUT AT ALL. Two independent bugs,
        # both measured:
        #   (a) `cyrius check <file>` WITHOUT `--with-deps` parses the file standalone
        #       with no manifest deps in scope, so `examples/basic_math.cyr` — which
        #       includes src/ modules that read the stdlib global `F64_ONE` — fails
        #       with `undefined variable 'F64_ONE'`. Actions runs `bash -e`, so the
        #       `out=$(...)` ASSIGNMENT inherited that non-zero status and aborted the
        #       step before a single line of its own logic ran: no grep hit, no
        #       `::error`, no summary. `--with-deps` compiles it the way a user does,
        #       and still detects a planted discard
        #       (`warning:<source>:74:26: #must_use result of 'calc_integral_simpson'
        #       is discarded`) — verified, not assumed.
        #   (b) The step NAME was unquoted, so YAML read ` #must_use results` as a
        #       COMMENT and the step appeared in the UI as plain "Discarded".
        # ⚠ The gate was only ever proven on the BUNDLE arm (a discard planted in
        # src/ode.cyr); the examples arm was never exercised and the YAML was never
        # run under `bash -e`. **Verifying that a gate fires is not the same as
        # running it the way CI runs it.**
        # A compile failure is now REPORTED with its output and fails the step, rather
        # than aborting it silently — the failure mode that hid this for four commits.
        run: |
          fail=0
          for target in "dist/hisab.cyr" examples/*.cyr; do
            [ -f "$target" ] || continue
            set +e
            out=$(cyrius check --with-deps "$target" 2>&1)
            rc=$?
            set -e
            if [ $rc -ne 0 ]; then
              echo "$out"
              echo "::error file=$target::cyrius check failed (exit $rc)"
              fail=1
              continue
            fi
            if echo "$out" | grep -q 'must_use'; then
              echo "$out" | grep 'must_use'
              echo "::error file=$target::a #must_use result is discarded"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "must_use: discarded results present"; exit 1; }

      - name: Duplicate global/enum symbols
        # ⛔ ADDED 2.19.0, AND THE MEASUREMENT IS THE WHOLE REASON IT EXISTS.
        # Converting the 12 `HSB_ERR_*` codes to an enum was justified on the roadmap
        # by "it moves them from a form cycc is SILENT about into one it DIAGNOSES by
        # file:line". Both halves are true and measured:
        #   duplicate `var` global   -> no diagnostic at all, last definition ships
        #   duplicate enum member    -> warning:<source>:57:35: duplicate symbol
        #                               'HSB_ERR_ALLOC' redefined with conflicting value
        # ⚠ BUT THE DIAGNOSIS ALONE FAILS NOTHING. `cyrius check --with-deps` prints
        # that warning and still **exits 0**, and `cyrius lint` does not emit it at all,
        # so the `^  warn ` grep two steps up matches zero times. Verified end to end by
        # adding a second `HSB_ERR_ALLOC = -3` to src/error.cyr: consumer-build exit 0,
        # lint clean, and only `tests/hisab.tcyr`'s distinctness block failed. Without
        # this step the conversion's stated safety benefit would not have been wired to
        # anything.
        # ⚠ The exit code is captured rather than inherited: under `bash -e` an
        # `out=$(...)` assignment aborts the step on a non-zero status with no output,
        # which is exactly how the #must_use step above stayed red and silent for four
        # commits.
        run: |
          set +e
          out=$(cyrius check --with-deps dist/hisab.cyr 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "$out"
            echo "::error file=dist/hisab.cyr::cyrius check failed (exit $rc)"
            exit 1
          fi
          if echo "$out" | grep -q 'duplicate symbol'; then
            echo "$out" | grep 'duplicate symbol'
            echo "::error file=dist/hisab.cyr::a global or enum symbol is defined twice"
            echo "duplicate symbols present (last definition wins - the wrong value ships)"
            exit 1
          fi

      - name: CGA null-basis derivation
        # ⭐ 2.21.0's basis change rests on three claims about the null-basis
        # product table — at most 2 terms per basis-blade product, all coefficients
        # exactly +/-1, and agreement with the shipped orthonormal table under the
        # change of basis — plus the reason the change is worth making: a conformal
        # point is EXACTLY null in the null basis at every magnitude. All four are
        # DERIVED from first principles here, not asserted.
        # ⚠ This exists as a gate because 2.20.0's audit found several of that
        # release's headline figures could not be re-derived from the tree: the
        # ⚠ "fail-closed" is now TRUE of every claim. It was not: claim 6 printed the
        # table FNV and never compared it, and claim 4's null arm was a tautology
        # (q + 2*(q/2)*(-1) is identically 0), so both exited 0 whatever the table
        # said. An audit before the 2.21.0 tag caught both. ~270 ms, deterministic,
        # fail-closed — verified by breaking each claim in turn.
        # (verified: breaking any claim exits 1).
        run: ./scripts/derive-cga-null-table.sh

      - name: Broken provenance markers
        # ⛔ ADDED 2.19.0. The `measurements` job below runs `--diff` and is PULL
        # REQUESTS ONLY, because a full-tree scan exits 1 on 284 unmarked paragraphs
        # of pre-existing debt. BROKEN markers are a different quantity: a marker
        # naming a file that does not exist, or one typo'd out of shape, is wrong
        # regardless of any debt — and the tree-wide count is **0** right now, so
        # gating it is free and fail-closed.
        # ⚠ THIS EXISTS BECAUSE --diff COULD NOT SEE ITS OWN DOMINANT CASE. A
        # path-resolution failure was filed against the PARAGRAPH'S first line, so a
        # bad marker appended to an EXISTING comment block was intersected away as
        # "not added". Measured, one marker, two placements: appended to the block at
        # src/vec3.cyr:126 `--diff HEAD` exited 0 and printed "Every measurement claim
        # added on this branch names its source"; the same marker as its own new
        # paragraph exited 1. The script now records the marker's own line and both
        # placements fail — but --diff still only ever sees a branch's own lines, and
        # this step sees the whole tree.
        # ⚠ Greps rather than trusting the exit code: the full scan exits 1 on the
        # unmarked-claim debt, so its status cannot distinguish the two failures.
        run: |
          out=$(./scripts/check-measurements.sh 2>&1 || true)
          if echo "$out" | grep -q 'BROKEN PROVENANCE MARKER'; then
            echo "$out" | grep -A3 'BROKEN PROVENANCE MARKER'
            echo "::error::a [measured: ...] marker names a missing file or is malformed"
            exit 1
          fi

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/hisab
          echo "hisab: $(wc -c < build/hisab) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/hisab | grep -q "7f45 4c46"

      - name: Verify printed version
        # ⭐ ADDED 2.19.0, AND IT IS THE FIRST GATE IN EITHER WORKFLOW THAT RUNS
        # THE BINARY. Every version check before this compared one piece of
        # committed TEXT against another; this compares what the shipped artifact
        # actually says against VERSION. Measured with VERSION bumped to 2.19.0:
        # the old hardcoded main.cyr rebuilds and still prints "hisab 2.18.0" and
        # this step fails; the CYRIUS_PKG_VERSION form prints "hisab 2.19.0" and
        # passes. That is the 2.9.1 -> 2.9.2 defect, reproduced and then gated.
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          OUT=$(./build/hisab)
          if [ "$OUT" != "hisab $VERSION" ]; then
            echo "::error file=src/main.cyr::build/hisab prints '$OUT', VERSION is '$VERSION'"
            exit 1
          fi
          echo "CLI prints: $OUT"

      - name: Test
        run: |
          for f in tests/*.tcyr; do
            [ -f "$f" ] || continue
            echo "::group::test $f"
            cyrius test "$f"
            echo "::endgroup::"
          done

      # docs/guides/testing.md publishes a per-suite assertion count and a total.
      # 2.21.0 found the rows summing to 3574 against a stated total of 3989 --
      # three of five rows had been stale for releases, and nothing checked them.
      # This asserts each row against the live suite AND that the rows sum to the
      # published total, so neither half can drift alone.
      - name: Published test counts match the suites
        run: |
          doc=docs/guides/testing.md
          fail=0
          sum=0
          for f in tests/*.tcyr; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            live=$(cyrius test "$f" 2>&1 | grep -oE '^[0-9]+ passed' | grep -oE '^[0-9]+')
            doc_n=$(grep -oE "^\| \`${name}\` \| [0-9]+ \|" "$doc" | grep -oE '[0-9]+' || true)
            if [ -z "$doc_n" ]; then
              echo "  $name: NO ROW in $doc"; fail=1; continue
            fi
            sum=$((sum + doc_n))
            if [ "$doc_n" != "$live" ]; then
              echo "  $name: doc says $doc_n, suite runs $live"; fail=1
            else
              echo "  $name: $live ok"
            fi
          done
          total=$(grep -oE '^\| \*\*Total\*\* \| \*\*[0-9]+\*\*' "$doc" | grep -oE '[0-9]+' || true)
          if [ "$total" != "$sum" ]; then
            echo "  Total row says $total, rows sum to $sum"; fail=1
          else
            echo "  total: $sum ok"
          fi
          if [ "$fail" != "0" ]; then
            echo "::error::docs/guides/testing.md is out of sync with the suites"
            exit 1
          fi

      - name: Fuzz
        run: |
          for f in tests/*.fcyr; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .fcyr)
            # ⚠ `build/fuzz-$name`, not `build/$name`: tests/hisab.fcyr yields the
            # name "hisab", so the old form OVERWROTE build/hisab — the CLI binary the
            # ELF and printed-version gates check. Harmless only because those steps run
            # before this one; a reorder, or any later step reading build/hisab, would
            # silently inspect the fuzz harness instead. Found while repairing the
            # #must_use step, not by anything failing.
            cyrius build "$f" "build/fuzz-$name"
            timeout 10 "build/fuzz-$name" || { echo "FUZZ CRASH: $name"; exit 1; }
            echo "  $name: ok"
          done

      - name: Bench
        run: |
          for f in tests/*.bcyr; do
            [ -f "$f" ] || continue
            cyrius bench "$f"
          done

  measurements:
    name: Measurement Provenance
    # PULL REQUESTS ONLY, and deliberately so. A full-tree scan reports 519
    # unmarked claims (pre-existing debt), and --ratchet is red against a stale
    # baseline, so neither can gate. What CAN gate is the comment lines a branch
    # ADDS: 4-6 markers for a commit-sized change, measured over HEAD~1..HEAD~5.
    #
    # This job carries its own checkout because it needs full history to resolve
    # the base ref. The build job's shallow clone stays shallow.
    #
    # fetch-depth: 0 is load-bearing. Without it origin/<base> does not exist in
    # the clone, the script falls back to HEAD, `git diff HEAD` is empty on a
    # clean checkout, and the gate passes VACUOUSLY -- green forever while
    # checking nothing. The explicit base below means an unresolvable ref exits 2
    # and fails the job instead.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Measurement claims added by this branch name their source
        run: ./scripts/check-measurements.sh --diff "origin/${{ github.base_ref }}"

      - name: Detector recall has not regressed
        # The planted corpus lives in the script. This is the half of the gate
        # that cannot be audited from the tree: it fails if a shape stops
        # catching a claim family, or starts catching a decoy.
        run: ./scripts/check-measurements.sh --selftest

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md LICENSE cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          # VERSION is the single source of truth; confirm the manifest pin
          # template is intact (matches abaco) before checking the changelog.
          grep -qF 'version = "${file:VERSION}"' cyrius.cyml \
            || { echo "FAIL: cyrius.cyml version is not \${file:VERSION}"; exit 1; }
          # Anchored to the Keep a Changelog header, and FIXED-string, on
          # purpose. This was `grep -q "$VERSION" CHANGELOG.md` — unanchored and
          # unescaped, so the dots were regex wildcards and `2.9.2` matched the
          # `32,942,104 B` in an unrelated benchmark line at CHANGELOG.md:498.
          # The gate passed VACUOUSLY: it would have gone green on a release
          # whose CHANGELOG section was never written. Same failure mode the
          # `fetch-depth: 0` comment in the measurements job warns about.
          grep -qF -- "## [$VERSION]" CHANGELOG.md \
            || { echo "FAIL: CHANGELOG.md has no '## [$VERSION]' section header"; exit 1; }
          # src/main.cyr USED TO hardcode the string the CLI prints — the one
          # version site ${file:VERSION} could not reach, a manual edit on every
          # bump, gated by nothing until 2.9.2 added the grep this replaces (the
          # 2.9.1 -> 2.9.2 bump had left it reading "hisab 2.9.1").
          # ⭐ 2.19.0: it prints CYRIUS_PKG_VERSION, which `cyrius build` declares
          # from [package].version = ${file:VERSION}. There is no second copy to
          # compare, so these two guards defend the MECHANISM instead: the symbol
          # is still used, and no hardcoded version literal has crept back.
          # ⚠ The real check is the build job's "Verify printed version", which
          # RUNS the binary. These are cheap source-level tripwires, not the gate.
          # ⚠ CODE ONLY, for both guards. The first draft of THIS one grepped the
          # whole file and was VACUOUS: the comment above the adoption names
          # `CYRIUS_PKG_VERSION` five times, so deleting the actual call and
          # printing a bare "hisab" still matched and the step exited 0. Caught by
          # running all three arms instead of only the one expected to pass.
          grep -v '^[[:space:]]*#' src/main.cyr | grep -qF 'CYRIUS_PKG_VERSION' \
            || { echo "FAIL: src/main.cyr no longer references CYRIUS_PKG_VERSION"; exit 1; }
          # ⚠ COMMENT LINES ARE STRIPPED FIRST, and that is not tidiness — the
          # first version of this guard FAILED ON ITS OWN TREE, because the
          # comment above the adoption quotes the retired `println("hisab 2.18.0")`
          # so a reader knows what changed. A gate that cannot tell code from a
          # comment quoting code would fire on every honest explanation of itself.
          if grep -v '^[[:space:]]*#' src/main.cyr \
               | grep -qE '"hisab [0-9]+\.[0-9]+\.[0-9]+"'; then
            echo "FAIL: src/main.cyr has a hardcoded version literal again"
            grep -nE '"hisab [0-9]+\.[0-9]+\.[0-9]+"' src/main.cyr
            exit 1
          fi
          # And the bundle header, which `cyrius distlib` stamps from VERSION —
          # a stale header means the bundle was not regenerated after the bump.
          grep -qF "# Version: $VERSION" dist/hisab.cyr \
            || { echo "FAIL: dist/hisab.cyr header is not $VERSION — run 'cyrius distlib'"; \
                 head -3 dist/hisab.cyr; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        # Mirrors abaco's security gate. Now that the 34 math modules live in
        # src/, this scans the full library surface. Comment lines are ignored.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"; echo "$hits"; FAIL=1
            fi
          }
          scan "raw execve"      'syscall\(\s*59'
          scan "raw fork"        'syscall\(\s*57'
          scan "sys_system"      '\bsys_system\s*\('
          scan "writes to /etc"  '"/etc/'
          scan "writes to /bin"  '"/bin/'
          scan "writes to /sbin" '"/sbin/'
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr | tee /tmp/bigbuf.txt
          [ -s /tmp/bigbuf.txt ] && FAIL=1
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL
