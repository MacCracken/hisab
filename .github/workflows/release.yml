name: Release

on:
  push:
    # Accept both `v1.2.3` and `1.2.3` tag styles. The version-verify
    # step below enforces semver shape + match against VERSION file.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"   # strip optional leading 'v' so v1.3.0 == 1.3.0
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyrius.cyml pulls from VERSION via \${file:VERSION})"

      - name: Install Cyrius toolchain
        # Upstream installer — see the long note on the identical step in ci.yml.
        # Short version: the hand-rolled extraction this replaces laid the
        # toolchain out FLAT (~/.cyrius/{bin,lib}) where cyrius wants
        # ~/.cyrius/versions/<pin>/, did NO checksum or signature verification,
        # and swallowed every copy error with `|| true` so it could not fail.
        # ⚠ On a RELEASE workflow the second of those is the serious one: this job
        # builds the artifact that ships.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          [ -n "$CYRIUS_VERSION" ] || { echo "could not read the cyrius pin from cyrius.cyml"; exit 1; }
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
          echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"

      - name: Verify toolchain matches the pin
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          ACTUAL="$(cyrius version | head -1 | awk '{print $2}')"
          [ "$ACTUAL" = "$CYRIUS_VERSION" ] || {
            echo "::error::toolchain is $ACTUAL but cyrius.cyml pins $CYRIUS_VERSION"; exit 1; }
          [ -d "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" ] || {
            echo "::error::stdlib snapshot missing at ~/.cyrius/versions/$CYRIUS_VERSION/lib"; exit 1; }
          echo "toolchain $ACTUAL matches the pin; stdlib snapshot present"

      - name: Resolve deps
        run: cyrius deps

      - name: Verify dep hashes
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          fi

      - name: Regenerate dist bundle
        # The 6.5.14–6.5.16 `distlib` self-check false positive that this step used
        # to tolerate was fixed upstream in 6.5.17, so a non-zero exit is a real
        # failure again. `check --with-deps` stays: it compiles the bundle the way a
        # consumer does, which is strictly stronger than the self-check either way.
        run: |
          cyrius distlib
          cyrius check --with-deps dist/hisab.cyr
          echo "dist/hisab.cyr: $(wc -c < dist/hisab.cyr) bytes"

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/hisab
          echo "hisab: $(wc -c < build/hisab) bytes"

      - name: Test
        run: |
          for f in tests/*.tcyr; do
            [ -f "$f" ] || continue
            cyrius test "$f"
          done

      - name: Fuzz
        run: |
          for f in tests/*.fcyr; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .fcyr)
            cyrius build "$f" "build/$name"
            timeout 10 "build/$name" || { echo "FUZZ CRASH: $name"; exit 1; }
          done

      - name: Clean toolchain artifacts
        run: rm -f cyrius-*.tar.gz

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="hisab-${TAG}/" -o "hisab-${TAG}-src.tar.gz" HEAD
          # Ship dist/hisab.cyr alongside the source so consumers can
          # pull a single self-contained module via `[deps.hisab]
          # modules = ["dist/hisab.cyr"]`.
          cp dist/hisab.cyr "hisab-${TAG}.cyr"
          if [ -f build/hisab ]; then
            cp build/hisab "hisab-${TAG}-x86_64-linux"
          fi
          sha256sum hisab-*.tar.gz hisab-*.cyr hisab-*-linux 2>/dev/null > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            hisab-*.tar.gz
            hisab-*.cyr
            hisab-*-linux
            cyrius.lock
            SHA256SUMS
        if: always()

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
          # Fallback to legacy "## TAG" header if "## [TAG]" not found
          if [ ! -s /tmp/body.md ]; then
            awk "/^## ${TAG}/{found=1; next} /^## /{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: "hisab ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') }}
          files: |
            hisab-*.tar.gz
            hisab-*.cyr
            hisab-*-linux
            cyrius.lock
            SHA256SUMS
